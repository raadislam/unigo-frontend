name: UniGo Frontend Dependency Security Audit

on:
  push:
    branches:
      - master
    paths:
      - 'docs/dependency-audit.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log("CURRENT_VULNERABILITY_COUNTS", JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log("VULNERABILITY", JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via || []).filter(value => typeof value === "object").map(value => ({
                title: value.title,
                url: value.url,
                range: value.range
              }))
            }));
          }
          NODE
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: unigo-frontend-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
