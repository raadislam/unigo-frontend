name: UniGo Frontend Dependency Security Audit

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-frontend-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log("CURRENT_VULNERABILITY_COUNTS", JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log("VULNERABILITY", JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via || []).filter(value => typeof value === "object").map(value => ({
                title: value.title,
                url: value.url,
                range: value.range
              }))
            }));
          }
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) {
            console.error("High or critical dependency vulnerabilities detected.");
            process.exit(1);
          }
          NODE
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: unigo-frontend-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
