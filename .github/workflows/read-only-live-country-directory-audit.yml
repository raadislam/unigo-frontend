name: Read-only Live Country Directory Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '4 * * * *'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/read-only-live-country-directory-audit.yml'
      - 'scripts/verify-country-directory.py'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/read-only-live-country-directory-audit.yml'
      - 'scripts/verify-country-directory.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: unigo-read-only-live-directory-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend audit definitions
        uses: actions/checkout@v4
      - name: Validate Python and workflow syntax
        run: |
          python3 -m py_compile scripts/verify-country-directory.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); puts "Workflow YAML syntax OK"' .github/workflows/read-only-live-country-directory-audit.yml

  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend audit definitions
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot authoritative public country and visa APIs
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL"
          python3 scripts/verify-country-directory.py --phase snapshot --api-url "$NEXT_PUBLIC_API_URL"
      - name: Verify live sitemap, directory and every country page
        run: |
          python3 scripts/verify-country-directory.py --phase live --base-url https://unigo-bd.com
