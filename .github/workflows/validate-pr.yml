name: Validate UniGo Frontend

on:
  push:
    branches:
      - fix/live-country-directory-data
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Lint and build static website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      - name: Verify static export
        run: test -s out/index.html