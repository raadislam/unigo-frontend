name: Deploy UniGo to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types:
      - visa-content-updated

permissions:
  contents: read

concurrency:
  group: unigo-hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy UniGo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Verify static export
        run: |
          test -d out
          test -s out/index.html
          echo "Static export generated successfully."

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$HOSTINGER_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connection and deployment directory
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/unigo_deploy \
            -p "$HOSTINGER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -d '$HOSTINGER_DEPLOY_PATH' && test -w '$HOSTINGER_DEPLOY_PATH'"

      - name: Deploy static files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/unigo_deploy -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            out/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_DEPLOY_PATH/"

      - name: Verify deployed homepage
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/unigo_deploy \
            -p "$HOSTINGER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -s '$HOSTINGER_DEPLOY_PATH/index.html' && echo 'Deployment verified successfully.'"

      - name: Verify live homepage, country pages and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree

          base_url = "https://unigo-bd.com"
          sitemap_path = Path("out/sitemap.xml")

          if not sitemap_path.is_file() or sitemap_path.stat().st_size == 0:
              raise SystemExit("Static sitemap is missing or empty.")

          root = ElementTree.parse(sitemap_path).getroot()
          urls = [
              node.text.strip()
              for node in root.iter()
              if node.tag.endswith("loc") and node.text
          ]

          country_slugs = []
          for url in urls:
              path = urlparse(url).path.strip("/")
              parts = path.split("/")
              if len(parts) == 2 and parts[0] == "visa-services":
                  country_slugs.append(parts[1])

          required_slugs = ["canada", "japan", "australia"]
          missing_slugs = [slug for slug in required_slugs if slug not in country_slugs]
          if missing_slugs:
              raise SystemExit(
                  f"Required published country pages are missing from the generated sitemap: {', '.join(missing_slugs)}"
              )

          other_slugs = [slug for slug in country_slugs if slug != "canada"]
          if len(other_slugs) < 1:
              raise SystemExit(
                  f"Expected at least one additional country page; found {len(other_slugs)}."
              )

          selected_slugs = sorted(set(["canada", *other_slugs]))
          for slug in selected_slugs:
              html_file = Path("out") / "visa-services" / slug / "index.html"
              if not html_file.is_file() or html_file.stat().st_size == 0:
                  raise SystemExit(f"Static country page is missing: {html_file}")

          urls_to_check = [
              f"{base_url}/",
              f"{base_url}/sitemap.xml",
              *(f"{base_url}/visa-services/{slug}/" for slug in selected_slugs),
          ]

          for url in urls_to_check:
              request = Request(url, headers={"User-Agent": "UniGo-Deployment-Check/1.0"})
              with urlopen(request, timeout=45) as response:
                  body = response.read()
                  if response.status != 200 or not body:
                      raise SystemExit(f"Live verification failed for {url}: HTTP {response.status}")
              print(f"HTTP 200 verified: {url}")

          print(f"Verified Canada plus {len(other_slugs)} additional country pages and the live sitemap.")
          PY
