name: Validate backend-generated checklist PDF client

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/components/visa-services/visa-checklist-generator.tsx'
      - '.github/workflows/validate-pdf-client.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.unigo-bd.com/api
          UNIGO_CONTENT_VERSION: pdf-client-validation
